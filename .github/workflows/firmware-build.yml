name: firmware-build

on:
  push:
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same ref.
# Also collapses the push-then-PR double-trigger to a single run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Software/STMCubeV2/BatteryMonitorV2

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ci-Debug, ci-Release]

    env:
      LLVM_VERSION: 19.1.5

    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM LLVM Embedded Toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-arm
          key: llvm-arm-${{ env.LLVM_VERSION }}-linux-x86_64

      - name: Install ARM LLVM Embedded Toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          curl -sSL -o llvm-arm.tar.xz \
            "https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-${LLVM_VERSION}/LLVM-ET-Arm-${LLVM_VERSION}-Linux-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-arm
          sudo tar -xJf llvm-arm.tar.xz -C /opt/llvm-arm --strip-components=1

      - name: Add toolchain to PATH
        run: echo "/opt/llvm-arm/bin" >> $GITHUB_PATH

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Toolchain version
        run: clang --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Memory budget check
        # Release is the shipped artifact — gate it tight at 85 % so growth
        # regressions surface immediately. Debug is dev-only and runs ~10 KB
        # heavier from -Og + -g3 + larger function-call thunks; gate it at
        # 95 % just to catch runaway, not to chase optimisation.
        run: |
          if [ "${{ matrix.preset }}" = "ci-Release" ]; then
            FLASH_LIMIT=85
          else
            FLASH_LIMIT=95
          fi
          python3 scripts/check_memory.py build/${{ matrix.preset }}/BatteryMonitorV2.elf --ram-limit 85 --flash-limit "$FLASH_LIMIT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            Software/STMCubeV2/BatteryMonitorV2/build/${{ matrix.preset }}/BatteryMonitorV2.elf
            Software/STMCubeV2/BatteryMonitorV2/build/${{ matrix.preset }}/BatteryMonitorV2.bin
            Software/STMCubeV2/BatteryMonitorV2/build/${{ matrix.preset }}/BatteryMonitorV2.map
          retention-days: 30
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest

    env:
      LLVM_VERSION: 19.1.5

    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM LLVM Embedded Toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm-arm
          key: llvm-arm-${{ env.LLVM_VERSION }}-linux-x86_64

      - name: Install ARM LLVM Embedded Toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          curl -sSL -o llvm-arm.tar.xz \
            "https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-${LLVM_VERSION}/LLVM-ET-Arm-${LLVM_VERSION}-Linux-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-arm
          sudo tar -xJf llvm-arm.tar.xz -C /opt/llvm-arm --strip-components=1

      - name: Add toolchain to PATH
        run: echo "/opt/llvm-arm/bin" >> $GITHUB_PATH

      - name: Install ninja and clang-tidy
        # ARM LLVM Embedded Toolchain ships clang/lld/llvm-* but NOT clang-tidy
        # (it's a build-only distro). We install clang-tidy from apt and tell
        # it via --extra-arg=-resource-dir below to use the ARM toolchain's
        # picolibc headers when parsing arm-none-eabi sources.
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy

      - name: Configure (for compile_commands.json)
        run: cmake --preset ci-Debug

      - name: Run clang-tidy
        # System clang-tidy (LLVM 18) provides the analyzer. Cross-compile
        # awareness comes from passing every include dir ARM LLVM clang would
        # use for cortex-m0plus as `--extra-arg=-isystem<dir>` so picolibc
        # headers (inttypes.h, etc.) resolve correctly.
        run: |
          INCLUDES=$(/opt/llvm-arm/bin/clang --target=arm-none-eabi -mcpu=cortex-m0plus \
                     -v -E -x c /dev/null 2>&1 | \
                     awk '/<\.\.\.> search starts here:/{f=1;next} /End of search list/{f=0} f && /^ /' | \
                     sed 's/^ *//')
          EXTRA=""
          for p in $INCLUDES; do
            EXTRA="$EXTRA --extra-arg=-isystem$p"
          done
          echo "::group::cross-toolchain isystem dirs"
          echo "$INCLUDES" | tr ' ' '\n'
          echo "::endgroup::"
          python3 scripts/lint.py \
            --build-dir build/ci-Debug \
            --warnings-as-errors \
            $EXTRA

  test_unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/STMCubeV2/BatteryMonitorV2

    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby + Ceedling + gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential gcovr
          sudo gem install --no-document ceedling
          ceedling version | head -3
          gcovr --version | head -1

      - name: Run unit tests with coverage
        working-directory: Software/STMCubeV2/BatteryMonitorV2/test
        run: ceedling gcov:all

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: Software/STMCubeV2/BatteryMonitorV2/test/build/artifacts/gcov/gcovr/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: Software/STMCubeV2/BatteryMonitorV2/test/build/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          fail_ci_if_error: true
          verbose: true

      - name: Check every hand-written .c has a test (or is exempt)
        # Runs LAST so that failures here don't suppress the coverage data
        # for everything that DOES have tests - the HTML artifact and the
        # Codecov upload above still happen before this step trips the job
        # red. Ceedling silently skips unlinked sources, so a new module
        # with no test_X.c never reaches Codecov and the missing-coverage
        # gap is invisible without this guard. See scripts/check_tests.py.
        run: python3 scripts/check_tests.py
