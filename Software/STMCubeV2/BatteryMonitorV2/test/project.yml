---
# Ceedling project config for BatteryMonitorV2 host-side unit tests.
#
# Build artifacts land under test/build/ (gitignored). Tests run with the
# host's native gcc — no cross-compile, no real HAL/CMSIS. Stub headers in
# test/support/ stand in for the STM32 includes so we can mock HAL functions
# with CMock.
#
# Invoke via:
#   wsl bash scripts/run-tests.sh
#   cmake --build build/Debug --target test_unit
#   ceedling test:all              (direct, from inside test/)

:project:
  :use_exceptions: FALSE
  :use_mocks: TRUE
  :use_test_preprocessor: :all
  :compile_threads: :auto
  :test_threads: :auto
  # Keep build_root inside the project tree. We tried /tmp/ for the WSL
  # perf win (40s -> 7s), but gcov stores source paths in .gcda relative
  # to the build location. With /tmp/ the relative `../Core/Src/...` no
  # longer reaches the real source, gcovr can't load files, and the
  # Cobertura XML comes out empty — Codecov rejects it. Working coverage
  # is worth the slower runs. Re-explore via -fprofile-prefix-map or a
  # symlink shim if WSL fs perf becomes a real pain point.
  :build_root: build/
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:paths:
  :test:
    - .
  :source:
    - ../Core/Src/
  :include:
    # Test-side stubs come FIRST so #include "main.h" / "tim.h" picks up
    # our minimal mock-friendly versions instead of the real STM HAL/CMSIS.
    - support/
    - ../Core/Inc/
    # u8g2 header — pure portable C, host-buildable. ssd1306.{h,c} and
    # its tests #include "u8g2.h" / "u8x8.h" for the message-id enums
    # and the u8x8_t struct definition.
    - ../Middlewares/u8g2/csrc/
  :support:
    - support/

# Ceedling auto-links the production source matching each test file's name
# (test_direct_io.c -> direct_io.c). We don't need an explicit :files:
# allow-list; the other Core/Src/*.c files never get pulled in unless
# something includes them.

:defines:
  :common: &common_defines
    - UNIT_TEST
  :test:
    - *common_defines
  :test_preprocess:
    - *common_defines

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: TRUE
  :plugins:
    - :ignore
    - :callback
    - :expect_any_args
    - :return_thru_ptr
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    bool:     UINT8

:flags:
  :test:
    :compile:
      :*:
        - -Wall
        - -Wextra
        - -Wno-unused-function
        - -Wno-unused-parameter
    :link:
      :*:
        # stack_measure.c uses pthread to run the function-under-test on a
        # sentinel-filled stack. Link pthread into every test binary so any
        # test can opt into the helper without ceremony.
        - -pthread

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - gcov

# gcov plugin configuration. `ceedling gcov:all` runs the tests with
# coverage instrumentation and emits both an HTML report (for browsing
# locally) and Cobertura XML (uploaded to Codecov by CI, which then
# posts inline-on-the-diff comments in PRs).
#
# We exclude test scaffolding (Unity / CMock generated runners + mocks
# + support/ stubs) from coverage so the metric reflects only our
# production code under test.
:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlBasic
    - Cobertura
  :gcovr:
    :report_root: ../
    :branches: TRUE
    :sort: uncovered-number
    :exclude:
      - '.*test.*'
      - '.*support.*'
      - '.*mock_.*'
      - '.*Unity.*'
      - '.*unity.*'
      - '.*CMock.*'
      - '.*cmock.*'
...
